<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Цель не найдена | MONOLITH: ARSENAL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e8e8ea; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; overflow: hidden; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(227,6,19,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(227,6,19,0.04) 1px, transparent 1px); background-size: 40px 40px; }
.wrap { position: relative; z-index: 1; max-width: 480px; }
.code { font-size: clamp(80px, 20vw, 160px); font-weight: 900; color: #e30613; line-height: 1; text-shadow: 0 0 40px rgba(227,6,19,0.5); letter-spacing: 4px; }
.title { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #8a8a94; margin: 16px 0 32px; }
.msg { font-size: 14px; color: #8a8a94; margin-bottom: 32px; line-height: 1.6; }
.btn { display: inline-block; padding: 14px 28px; background: #e30613; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #e30613; transition: all 0.2s; }
.btn:hover { background: #ff1f2e; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="title">// Цель не найдена</div>
    <p class="msg">Страница уничтожена или никогда не существовала.<br>Система зафиксировала попытку доступа к пустоте.</p>
    <a href="/" class="btn">← Вернуться на базу</a>
  </div>
</body>
</html>
